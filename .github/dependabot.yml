version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # VS Code uzantılarında @types/vscode, package.json'daki minimum engine (1.106.0) sürümüne kilitlenmelidir.
      - dependency-name: "@types/vscode"
      # Node 22 LTS hedefli olduğu için majör yükseltmeler engellenir.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majör yükseltmeleri kontrollü ve birlikte yapılmalıdır.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /webview-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # Tailwind v4 tam yapılandırma göçü gerektirdiğinden v3 hattında tutulur.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

