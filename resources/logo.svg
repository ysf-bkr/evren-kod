<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 512" width="1600" height="512" fill="none">
  <defs>
    <!-- Kalkan Gradyanları -->
    <linearGradient id="logoShieldRim" x1="106" y1="56" x2="406" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="logoShieldBody" x1="256" y1="60" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1938" />
      <stop offset="50%" stop-color="#070f24" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Kod Sembolü </> Gradyanı -->
    <linearGradient id="logoCodeGrad" x1="182" y1="136" x2="330" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Sonsuzluk Şeridi Gradyanı (Mavi -> Eflatun) -->
    <linearGradient id="logoInfGrad" x1="36" y1="276" x2="476" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Doğrulama Mührü Gradyanı -->
    <linearGradient id="logoSealGrad" x1="228" y1="347" x2="284" y2="403" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Tema Duyarlı Tipografi Stilleri -->
    <style>
      .brand-title {
        fill: #f8fafc;
      }
      .brand-tagline-lead {
        fill: #38bdf8;
      }
      .brand-tagline-sub {
        fill: #94a3b8;
      }
      @media (prefers-color-scheme: light) {
        .brand-title {
          fill: #0f172a;
        }
        .brand-tagline-lead {
          fill: #0284c7;
        }
        .brand-tagline-sub {
          fill: #475569;
        }
      }
    </style>
  </defs>

  <!-- Sol Amblem Grubu (Kalkan + Kod + Sonsuzluk + Kanıt Mührü) -->
  <g transform="translate(48, 16) scale(0.94)">
    <path d="M 256 56 C 295 72 355 96 406 118 C 406 185 396 310 256 440 C 116 310 106 185 106 118 C 157 96 217 72 256 56 Z"
          fill="url(#logoShieldBody)" stroke="url(#logoShieldRim)" stroke-width="16" stroke-linejoin="round" />

    <path d="M 256 74 C 288 88 344 110 384 128 C 384 185 375 292 256 414 C 137 292 128 185 128 128 C 168 110 224 88 256 74 Z"
          fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.25" />

    <g stroke="url(#logoCodeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 222 142 L 182 174 L 222 206" />
      <path d="M 272 136 L 240 212" />
      <path d="M 290 142 L 330 174 L 290 206" />
    </g>

    <path d="M 256 276 C 290 232 345 210 405 218 C 455 225 476 256 476 276 C 476 302 450 332 400 336 C 340 340 285 315 256 276 C 227 237 172 212 112 216 C 62 220 36 250 36 276 C 36 296 57 327 107 334 C 167 342 222 320 256 276 Z"
          stroke="url(#logoInfGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <g transform="translate(256, 375)">
      <circle cx="0" cy="0" r="30" fill="url(#logoSealGrad)" stroke="#10b981" stroke-width="6" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#34d399" stroke-width="2" opacity="0.4" />
      <path d="M -11 1 L -3 9 L 13 -7" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Sağ Tipografi Grubu (Optik Denge & Tema Duyarlı) -->
  <text x="560" y="215" class="brand-title" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="138" font-weight="800" letter-spacing="-3">Evren <tspan fill="#0092fa">Kod</tspan></text>
  <text x="566" y="295" class="brand-tagline-lead" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="600" letter-spacing="-0.3">Türkiye'nin ve dünyanın en güvenli, kurumsal gizliliğe saygılı</text>
  <text x="566" y="348" class="brand-tagline-sub" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="500" letter-spacing="-0.2">ve kanıtsız kodu teslim etmeyen kalite asistanı.</text>
</svg>
